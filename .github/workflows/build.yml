name: Byg app

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency: build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.10.2'

      - name: Hent signeringsnøgle fra GitHubs hemmelige boks
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Hemmeligheden KEYSTORE_B64 eller KEYSTORE_PASSWORD mangler under Settings → Secrets and variables → Actions" | tee build.log
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore

      - name: Versionsnumre
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # To numre pr. version:
          #  - internt: v0.1.<byggenummer> – fortløbende; det er det, ældre app-versioner sammenligner
          #  - officielt: fx 0.2.0 – står i app'en, i ændringslisten og som udgivelsens titel
          # Det officielle tages fra "- **Næste version 0.2.0** –" i CHANGELOG.md; står der kun
          # "- **Næste version** –" (eller ingenting), tælles sidste tal op fra forrige udgivelse
          RUN=${{ github.run_number }}
          WANT=$(grep -m1 -E '^- \*\*Næste version' CHANGELOG.md | sed -nE 's/^- \*\*Næste version ([0-9]+\.[0-9]+\.[0-9]+)\*\*.*/\1/p' || true)
          if [ -z "$WANT" ]; then
            LAST=$(gh release view --repo "${{ github.repository }}" --json name -q .name 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$' || true)
            [ -z "$LAST" ] && LAST="0.1.$((RUN - 1))"
            IFS=. read -r A B C <<< "$LAST"
            WANT="$A.$B.$((C + 1))"
          fi
          echo "Officielt nummer $WANT, internt v0.1.$RUN"
          echo "VERSION_NAME=$WANT" >> "$GITHUB_ENV"
          echo "TAG=v0.1.$RUN" >> "$GITHUB_ENV"

      - name: Ændringsliste ind i app'en
        shell: bash
        run: |
          # "Næste version" i CHANGELOG.md får det officielle nummer og byggenummeret i parentes
          sed -i -E "0,/^- \*\*Næste version[^*]*\*\*/s//- **${VERSION_NAME}** (${{ github.run_number }})/" CHANGELOG.md
          mkdir -p app/src/main/assets
          cp CHANGELOG.md app/src/main/assets/CHANGELOG.md

      - name: Byg APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          # Enhedstests først: fejler de, udgives der ikke
          gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Slet nøglen fra byggemaskinen
        if: always()
        shell: bash
        run: rm -f app/release.keystore

      - name: Udgiv på GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk NFClibra.apk
          # Samme fil under det gamle navn, så gamle links og ældre versioner af app'en stadig kan opdatere
          cp NFClibra.apk CiceroNFC.apk
          # Udgivelsens tekst er versionens linje i CHANGELOG.md – ellers commit-beskeden
          grep -m1 -F -- "- **${VERSION_NAME}** (${{ github.run_number }}) – " CHANGELOG.md | sed 's/^- \*\*[^*]*\*\* ([0-9]*) – //' > notes.txt || true
          if [ ! -s notes.txt ]; then
            git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):' > notes.txt
          fi
          printf '\nBygget fra %s\nByggenummer %s\n' "${GITHUB_SHA::7}" "${{ github.run_number }}" >> notes.txt
          # Lille versionsfil, som app'en tjekker (tæller ikke med i GitHubs grænse for API-opslag)
          # "code" er løbenummeret, som app'en sammenligner med (versionsnummeret kan så følges frit)
          jq -n --arg tag "$TAG" --arg name "$VERSION_NAME" --rawfile notes notes.txt --argjson code ${{ github.run_number }} \
            '{tag: $tag, name: $name, apk: "NFClibra.apk", notes: $notes, code: $code}' > version.json
          # Genkørsel af en bygning, der nåede at udgive: den halve udgivelse med samme nummer erstattes
          if [ "${{ github.run_attempt }}" != "1" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" NFClibra.apk CiceroNFC.apk version.json \
            --title "NFClibra $VERSION_NAME" \
            --notes-file notes.txt --latest

      - name: Skriv versionsnummeret ind i CHANGELOG.md
        shell: bash
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -qm "CHANGELOG: version ${VERSION_NAME} (${{ github.run_number }})"
            git push -q origin HEAD:main || echo "Kunne ikke skrive versionsnummeret tilbage (main er ændret imens)"
          fi

      - name: Gem byggelog (til fejlfinding)
        if: always()
        # Loggen er kun til fejlfinding: lykkes det ikke at gemme den, er bygningen ikke fejlet
        continue-on-error: true
        shell: bash
        run: |
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cp build.log /tmp/build.log 2>/dev/null || echo "ingen log" > /tmp/build.log
          # Loggen lægges oven på den forrige (ikke en ny historik, der overskriver grenen – det afviste GitHub nogle gange)
          if ! git clone -q --depth 1 --branch build-log "$REPO" /tmp/logbranch 2>/dev/null; then
            mkdir -p /tmp/logbranch && cd /tmp/logbranch && git init -q -b build-log && cd - >/dev/null
          fi
          cp /tmp/build.log /tmp/logbranch/build.log
          echo "${{ job.status }} ${GITHUB_SHA} run ${{ github.run_number }}" > /tmp/logbranch/status.txt
          cd /tmp/logbranch
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Byggelog ${GITHUB_SHA::7} (run ${{ github.run_number }})"
          # Op til tre forsøg; fejlbeskeden skrives i Actions-loggen, hvis alle tre fejler
          for i in 1 2 3; do
            if git push "$REPO" HEAD:build-log 2>push.err; then exit 0; fi
            echo "Forsøg $i på at gemme byggeloggen fejlede:"; sed 's/x-access-token:[^@]*@/***@/' push.err
            sleep $((i * 5))
            # Er grenen ændret imens, lægges loggen oven på den nye udgave
            git pull -q --rebase -X theirs "$REPO" build-log 2>/dev/null || true
          done
          exit 1
